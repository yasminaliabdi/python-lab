<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Part 1: Page Header -->
    <header>
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <!-- Part 2: Add Expense Section -->
    <section id="add-expense">
        <h2>Add Expense</h2>
        <div>
            <label for="expense-name">Expense Name:</label>
            <input type="text" id="expense-name" placeholder="e.g., Groceries">
        </div>
        <div>
            <label for="expense-amount">Amount:</label>
            <input type="text" id="expense-amount" placeholder="e.g., 500">
        </div>
        <div>
            <label for="expense-category">Category:</label>
            <input type="text" id="expense-category" placeholder="e.g., Food">
        </div>
    </section>

    <!-- Part 3: Your Expenses Placeholder -->
    <section id="expenses-placeholder">
        <h2>Your Expenses</h2>
        <p>No expenses yet.</p>
    </section>

</body>
</html>
